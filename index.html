<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolkata Durga Puja 2026 Pandal-Hopping Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8F8FB; --surface:#FFFFFF; --ink:#1A1B3A; --ink-soft:#55587A; --line:#DCDDEA;
  --lal:#C4122F; --lal-ink:#FFFFFF; --gold:#F5A300; --gold-soft:#FFF4D6; --gold-ink:#5B3C00;
  --blue:#1565C0; --green:#2E7D32; --purple:#7B2CBF; --none:#7A7D99;
  --serif:"Tiro Bangla","Noto Serif Bengali",Georgia,"Times New Roman",serif;
  --sans:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10112A; --surface:#191A3A; --ink:#F0EFF8; --ink-soft:#A9ABCB; --line:#2E3057;
    --lal:#FF5470; --lal-ink:#1A0008; --gold:#FFBE3D; --gold-soft:#2C2410; --gold-ink:#FFE2A3;
    --blue:#6FB0FF; --green:#6FD07A; --purple:#C58CFF; --none:#9A9DC0;
  }
}
:root[data-theme="dark"]{
  --paper:#10112A; --surface:#191A3A; --ink:#F0EFF8; --ink-soft:#A9ABCB; --line:#2E3057;
  --lal:#FF5470; --lal-ink:#1A0008; --gold:#FFBE3D; --gold-soft:#2C2410; --gold-ink:#FFE2A3;
  --blue:#6FB0FF; --green:#6FD07A; --purple:#C58CFF; --none:#9A9DC0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:calc(var(--hdr,60px) + 130px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
html[lang="bn"] body{line-height:1.75}
a{color:inherit}
:focus-visible{outline:3px solid var(--lal);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

/* lal-par: the red border of the white Ashtami saree */
.par{height:22px;background:
  linear-gradient(var(--lal),var(--lal)) 0 0/100% 12px no-repeat,
  linear-gradient(var(--lal),var(--lal)) 0 18px/100% 3px no-repeat,
  var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* hero */
.hero{padding:44px 20px 28px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,12vw,6.6rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.hero .sub{font-family:var(--serif);font-size:clamp(1.25rem,3.6vw,1.9rem);margin:10px 0 0;color:var(--ink)}
.hero .lede{max-width:56ch;margin:18px 0 0;color:var(--ink-soft);font-size:1.05rem}
.jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.jump a{font-weight:600;text-decoration:none;border-bottom:2px solid var(--lal);padding-bottom:1px}
.when{margin-top:26px;display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-left:6px solid var(--lal);background:var(--surface);border-radius:4px}
.when>div{flex:1 1 120px;padding:12px 16px;border-right:1px solid var(--line)}
.when>div:last-child{border-right:0}
.when b{display:block;font-weight:600}
.when span{color:var(--ink-soft);font-size:.92rem}
.when .now{background:var(--lal);color:var(--lal-ink)}
.when .now span{color:inherit;opacity:.92}
.note{font-size:.88rem;color:var(--ink-soft);margin:10px 0 0;max-width:70ch}

/* toolbar */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,60px));z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 0}
.bar .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;font:inherit;font-size:1rem;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.sel{font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.lang button{font:inherit;font-size:.92rem;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:.95rem;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}

/* regions */
.region{padding:38px 0 6px}
.region h2,.sec h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.15;margin:0}
.region .desc{margin:8px 0 0;color:var(--ink-soft);max-width:62ch}
.hoods{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.hoods a{font-size:.88rem;text-decoration:none;border:1px dashed var(--line);padding:4px 10px;border-radius:999px;color:var(--ink-soft)}
.hoods a:hover{border-color:var(--lal);color:var(--lal)}
.list{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:16px 0 16px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--lal)}
.item h3{margin:0;font-size:1.12rem;font-weight:600;line-height:1.35}
.meta{color:var(--ink-soft);font-size:.93rem}
.theme{margin-top:2px;font-family:var(--serif);font-size:1.02rem}
.theme.tbc{color:var(--ink-soft);font-family:var(--sans);font-size:.9rem;font-style:italic}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);margin-left:6px;vertical-align:middle}
.tag.sp{background:var(--gold);color:#2A1B00;border-color:var(--gold)}
.metro{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.92rem;text-align:right}
.mline{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--none);flex:0 0 12px}
.dot.B{background:var(--blue)}.dot.G{background:var(--green)}.dot.P{background:var(--purple)}
.metro small{color:var(--ink-soft);font-size:.8rem}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{font:inherit;font-size:.92rem;font-weight:600;text-decoration:none;padding:7px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.map{background:var(--lal);border-color:var(--lal);color:var(--lal-ink)}
.btn.add[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line);font-weight:500;color:var(--ink-soft)}
.empty{padding:26px 16px;border:1px dashed var(--line);margin-top:16px;border-radius:6px;color:var(--ink-soft)}

/* shows */
.sec{padding:46px 0 6px}
.sec .desc{margin:8px 0 0;color:var(--ink-soft);max-width:64ch}
.disc{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--gold);background:var(--gold-soft);color:var(--gold-ink);font-size:.92rem;max-width:72ch}
.moments{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.moments li{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.moments b{display:block;font-family:var(--serif);font-weight:400;font-size:1.05rem}
.moments span{color:var(--ink-soft);font-size:.9rem}
.sfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.shows{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.show{display:grid;grid-template-columns:96px 1fr auto;gap:6px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.show .when2{border-left:4px solid var(--lal);padding-left:12px;line-height:1.3}
.show .when2 b{display:block;font-weight:700}
.show .when2 span{color:var(--ink-soft);font-size:.88rem}
.show h3{margin:0;font-size:1.12rem;font-weight:600;line-height:1.35}
.show.promo{background:var(--gold-soft);padding-left:12px;padding-right:12px;border-left:4px solid var(--gold)}
.show.openslot{border-style:dashed;color:var(--ink-soft)}
.price{font-weight:600}
.show .right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right}
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:22px}

/* sponsors */
.sponsor-band{margin:44px 0 0;border:2px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:22px 20px 24px}
.sponsor-band h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.3rem);margin:0}
.paid{display:inline-block;background:var(--gold);color:#2A1B00;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:3px;margin-bottom:8px}
.sponsor-band p{margin:8px 0 0;max-width:64ch;color:var(--gold-ink)}
.slots{display:grid;gap:12px;margin-top:18px}
.slots.plat{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.slots.gold{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.slot{background:var(--surface);border:1px solid var(--gold);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.slot.open{border-style:dashed;color:var(--ink-soft)}
.slot .tier{font-size:.78rem;font-weight:700;color:var(--gold-ink)}
.slot h3{margin:0;font-size:1.1rem}
.slot.plat h3{font-family:var(--serif);font-weight:400;font-size:1.4rem}
.slot p{margin:0;color:var(--ink-soft);font-size:.93rem}
.simg{display:block;width:100%;aspect-ratio:4/5;border:0;padding:0;cursor:zoom-in;border-radius:4px;overflow:hidden;background:var(--paper)}
.simg img{width:100%;height:100%;object-fit:cover;display:block}
.sbtns{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.slot a.go,.slot .go{margin-top:auto;font-weight:600;color:var(--lal)}
.linkbtn{font:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline}
dialog.enq{border:2px solid var(--ink);border-radius:8px;padding:0;max-width:560px;width:calc(100% - 28px);background:var(--surface);color:var(--ink);max-height:calc(100% - 28px);overflow:auto}
dialog.enq::backdrop{background:rgba(10,10,30,.6)}
.enq form{padding:20px}
.enq h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.enq .fld{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.enq label{font-weight:600;font-size:.92rem}
.enq input,.enq select,.enq textarea{font:inherit;font-size:1rem;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.enq textarea{min-height:90px;resize:vertical}
.enq .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.enq .acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.enq .err{color:var(--lal);font-weight:600;font-size:.92rem;min-height:1.2em;margin-top:10px}
.enq .fallback{margin-top:12px;font-size:.88rem;color:var(--ink-soft)}
.enq .x{position:absolute;right:12px;top:10px;font:inherit;font-size:1.4rem;line-height:1;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 10px}
@media (max-width:520px){.enq .row2{grid-template-columns:1fr}}
.site-hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-top:8px;padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex:1 1 auto;min-width:0}
.brand-bn{font-family:var(--serif);font-size:1.5rem;line-height:1.2}
.brand-name{font-weight:700;font-size:.98rem;color:var(--lal)}
.tabs{order:3;width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;font-weight:600;padding:9px 12px;border-bottom:3px solid transparent;font-size:.96rem}
.tabs a[aria-current="page"]{border-bottom-color:var(--lal);color:var(--lal)}
@media (max-width:620px){.brand-bn{display:none}.brand-name{font-size:1.02rem}}
@media (min-width:900px){.hdr-in{flex-wrap:nowrap;padding-bottom:0}.brand{flex:0 0 auto}.tabs{order:2;width:auto;flex:1;margin-left:14px}.lang{order:3}}
.stats{margin:14px 0 0;font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn.big{padding:12px 22px;font-size:1.02rem}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:18px;background:var(--surface);border-radius:4px}
.feat{display:block;padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-top:5px solid var(--lal);margin-top:-1px;text-decoration:none}
.feat b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;margin-bottom:4px;line-height:1.25}
.feat span{color:var(--ink-soft);font-size:.93rem}
.feat:hover{background:var(--paper)}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.rtile{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);border-left:5px solid var(--lal);background:var(--surface);color:var(--ink);padding:14px;border-radius:4px}
.rtile b{display:block;font-family:var(--serif);font-weight:400;font-size:1.25rem;line-height:1.25}
.rtile span{color:var(--ink-soft);font-size:.9rem}
.rtile:hover{background:var(--paper)}
.hiw{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.hiw li{display:flex;gap:12px;align-items:flex-start}
.hiw b{display:block}
.hiw span.t{color:var(--ink-soft);font-size:.93rem}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
.wcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--lal);border-radius:4px;overflow:hidden}
.wcard.promo{border-color:var(--gold);border-top-color:var(--gold);background:var(--gold-soft)}
.wcard.openslot{border-style:dashed;border-top-style:dashed;color:var(--ink-soft)}
.wimg{aspect-ratio:1/1;background:var(--paper);overflow:hidden}
.wimg-btn{display:block;width:100%;border:0;padding:0;cursor:zoom-in}
.wbuy .btn{white-space:nowrap}
#imgview{max-width:620px}
#imgview img{width:100%;height:auto;display:block;border-radius:4px;margin-top:6px}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.poster{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:22px;color:#fff;background:linear-gradient(160deg,#C4122F,#6B0A1B);box-shadow:inset 0 0 0 7px rgba(255,255,255,.88),inset 0 0 0 10px #C4122F}
.poster .pg{font-family:var(--serif);font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.2}
.poster .pt{font-size:.85rem;opacity:.92;max-width:16ch}
.wbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.wbody h3{margin:0;font-size:1.05rem;line-height:1.35}
.wbuy{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px}
.mapbtn{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--lal-ink);background:var(--lal);border-radius:999px;padding:2px 11px 2px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.mapbtn svg{width:14px;height:14px;fill:currentColor}
.mapbtn:hover{filter:brightness(1.1)}
.planner{margin-top:8px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px}
.pl-grid .fld{display:flex;flex-direction:column;gap:4px}
.pl-grid label{font-weight:600;font-size:.92rem}
.msel{position:relative}
.msel-btn{width:100%;text-align:left;font-weight:600;cursor:pointer;padding:12px 14px}
.msel-btn::after{content:"▾";float:right}
.msel-panel{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.msel-list{max-height:min(340px,50vh);overflow:auto;margin-top:8px}
.msel-list h4{margin:12px 0 4px;font-size:.78rem;letter-spacing:.04em;color:var(--ink-soft)}
.msel-list label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer;font-weight:400;font-size:.95rem}
.msel-list input{margin-top:5px;flex:0 0 auto;width:auto}
.msel-list small{color:var(--ink-soft);display:block}
.msel-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 5px 4px 12px;font-size:.9rem}
.pchip button{border:0;background:var(--line);color:var(--ink);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1;font-size:1rem}
.pl-sum{margin-top:18px;padding:12px 14px;border-left:6px solid var(--lal);background:var(--surface);border-radius:4px;font-weight:600}
.pl-empty{margin-top:18px;padding:18px;border:1px dashed var(--line);border-radius:6px;color:var(--ink-soft)}
.route{list-style:none;margin:12px 0 0;padding:0}
.route .leg{margin:0 0 0 17px;padding:8px 0 8px 22px;border-left:3px dotted var(--lal);color:var(--ink-soft);font-size:.88rem}
.route .stop{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:10px 0}
.route .stop h3{margin:0;font-size:1.08rem;font-weight:600;line-height:1.4}
.num{width:36px;height:36px;border-radius:50%;background:var(--lal);color:var(--lal-ink);display:grid;place-items:center;font-weight:700}
.times{text-align:right;font-weight:700;white-space:nowrap}
.times span{display:block;font-weight:400;color:var(--ink-soft);font-size:.88rem}
@media (max-width:620px){.route .stop{grid-template-columns:36px 1fr}.times{grid-column:2;text-align:left}}
.enq-sec{border:2px solid var(--ink);border-radius:8px;background:var(--surface);margin-top:46px;padding:0}
.contact-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
body.has-trail .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.fab .btn{box-shadow:0 2px 10px rgba(0,0,0,.28);padding:10px 16px}
.rates{margin-top:22px;overflow-x:auto}
.rates table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface)}
.rates th,.rates td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:top}
.rates th{font-weight:700}
.inline-sp{display:grid;grid-template-columns:1fr auto;gap:4px 18px;padding:14px 16px;background:var(--gold-soft);border-bottom:1px solid var(--line);border-left:4px solid var(--gold)}
.inline-sp h3{margin:0;font-size:1.05rem}
.inline-sp p{margin:0;color:var(--gold-ink);font-size:.92rem}

/* tips */
.tips{margin-top:46px}
.tips h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.3rem);margin:0 0 6px;line-height:1.2}
.nights{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.nights li{display:grid;grid-template-columns:170px 1fr;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.nights b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 0;font-size:.9rem;color:var(--ink-soft);list-style:none;padding:0}
.legend span{display:inline-flex;align-items:center;gap:7px}
footer{margin:56px 0 0;padding:26px 0 120px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:.9rem}
footer p{max-width:72ch;margin:0 0 10px}

/* trail bar */
.trail{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--paper);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.trail.show{display:block}
.trail .in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.trail .btn{background:var(--lal);color:var(--lal-ink);border-color:var(--lal)}
.trail .btn.clear{background:transparent;color:var(--paper);border-color:var(--paper)}
.trail span{font-weight:600}

@media (max-width:620px){
  body{font-size:16px}
  .item{grid-template-columns:1fr}
  .metro{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:4px 10px}
  .nights li{grid-template-columns:1fr}
  .when>div{border-right:0;border-bottom:1px solid var(--line)}
  .show{grid-template-columns:1fr}
  .show .right{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;align-items:center}
}
</style>
</head>
<body>

<div class="par" aria-hidden="true"></div>

<header class="site-hdr" id="site-hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="#/home"><span lang="bn" class="brand-bn">পুজো ২০২৬</span><span class="brand-name" data-i="brand"></span></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="bn" aria-pressed="false" lang="bn">বাংলা</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Main">
      <a href="#/home" data-nav="home" data-i="navHome"></a>
      <a href="#/pandals" data-nav="pandals" data-i="navPandals"></a>
      <a href="#/plan" data-nav="plan" data-i="navPlan"></a>
      <a href="#/shows" data-nav="shows" data-i="navShows"></a>
      <a href="#/wishes" data-nav="wishes" data-i="navWishes"></a>
      <a href="#/advertise" data-nav="advertise" data-i="navAdvertise"></a>
    </nav>
  </div>
</header>

<!-- ============ HOME ============ -->
<div class="view" data-view="home" id="v-home">
  <div class="wrap hero">
    <h1 lang="bn">পুজো ২০২৬</h1>
    <p class="sub" data-i="sub"></p>
    <p class="lede" data-i="lede"></p>
    <p class="stats" id="home-stats"></p>
    <div class="cta-row">
      <a class="btn map big" href="#/plan" data-i="ctaPlan"></a>
      <a class="btn big" href="#/pandals" data-i="ctaBrowse"></a>
    </div>
    <div class="contact-row" id="contact-row"></div>
    <div class="when" id="when"></div>
    <p class="note" data-i="dateNote"></p>
  </div>
  <div class="wrap">
    <section class="sec" aria-labelledby="hf-h">
      <h2 id="hf-h" data-i="featTitle"></h2>
      <div class="feats" id="home-feats"></div>
    </section>
    <section class="sec" aria-labelledby="hr-h">
      <h2 id="hr-h" data-i="regionsTitle"></h2>
      <div class="rtiles" id="home-regions"></div>
    </section>
    <section class="sec" aria-labelledby="hh-h">
      <h2 id="hh-h" data-i="hlTitle"></h2>
      <p class="desc" data-i="hlDesc"></p>
      <ul class="list" id="home-hl"></ul>
      <p style="margin-top:14px"><a class="btn" href="#/pandals" data-i="seeAll"></a></p>
    </section>
    <section class="sec" aria-labelledby="hw-h">
      <h2 id="hw-h" data-i="hiwTitle"></h2>
      <ol class="hiw" id="home-hiw"></ol>
    </section>
  <section class="sponsor-band" id="sponsors" aria-labelledby="sp-h">
    <span class="paid" data-i="paidBadge"></span>
    <h2 id="sp-h" data-i="spTitle"></h2>
    <p data-i="spNote"></p>
    <div class="slots plat" id="slots-plat"></div>
    <div class="slots gold" id="slots-gold"></div>
    <p style="margin-top:16px"><a class="btn map" href="#/advertise" data-i="seePackages"></a></p>
  </section>
  </div>
</div>

<!-- ============ PANDALS ============ -->
<div class="view" data-view="pandals" id="v-pandals" hidden>
  <nav class="bar" aria-label="Filters">
    <div class="wrap">
      <div class="row">
        <input id="q" class="search" type="search" data-ip="searchPh" aria-label="Search pandals">
        <select id="line" class="sel" aria-label="Metro line"></select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Region"></div>
    </div>
  </nav>
  <div class="wrap">
    <div id="regions"></div>
  </div>
</div>

<!-- ============ PLAN ============ -->
<div class="view" data-view="plan" id="v-plan" hidden>
  <div class="wrap">
  <section class="sec planner" id="planner" aria-labelledby="pl-h">
    <h2 id="pl-h" data-i="plTitle"></h2>
    <p class="desc" data-i="plDesc"></p>
    <div class="pl-grid">
      <div class="fld" style="grid-column:1/-1">
        <label id="l-msel" for="msel-btn"></label>
        <div class="msel" id="msel">
          <button type="button" class="sel msel-btn" id="msel-btn" aria-haspopup="true" aria-expanded="false" aria-controls="msel-panel"></button>
          <div class="msel-panel" id="msel-panel" hidden>
            <input type="search" id="msel-q" class="search" style="width:100%;flex:none" autocomplete="off">
            <div class="msel-list" id="msel-list"></div>
            <div class="msel-foot"><button type="button" class="btn ghost" id="msel-clear"></button><button type="button" class="btn map" id="msel-done"></button></div>
          </div>
        </div>
      </div>
      <div class="fld"><label id="l-day" for="pl-day"></label><select id="pl-day" class="sel"></select></div>
      <div class="fld"><label id="l-start" for="pl-start"></label><input id="pl-start" class="sel" type="time" value="18:00"></div>
      <div class="fld"><label id="l-dwell" for="pl-dwell"></label><select id="pl-dwell" class="sel"></select></div>
      <div class="fld"><label id="l-first" for="pl-first"></label><select id="pl-first" class="sel"></select></div>
    </div>
    <div class="pl-chips" id="pl-chips"></div>
    <p class="note" id="pl-daynote" style="margin-top:12px"></p>
    <div id="pl-sum"></div>
    <ol class="route" id="pl-out"></ol>
    <div class="contact-row" id="pl-actions"></div>
    <p class="note" data-i="plNote"></p>
  </section>
  <section class="tips" aria-labelledby="tips-h">
    <h2 id="tips-h" data-i="tipsTitle"></h2>
    <p class="meta" style="max-width:62ch" data-i="tipsIntro"></p>
    <ol class="nights" id="nights"></ol>
    <ul class="legend" id="legend"></ul>
    <p class="note" data-i="metroNote"></p>
  </section>
  </div>
</div>

<!-- ============ SHOWS ============ -->
<div class="view" data-view="shows" id="v-shows" hidden>
  <div class="wrap">
  <section class="sec" id="shows" aria-labelledby="sh-h">
    <h2 id="sh-h" data-i="showsTitle"></h2>
    <p class="desc" data-i="showsDesc"></p>
    <p class="disc" data-i="showsDisc"></p>
    <ul class="moments" id="moments"></ul>
    <div class="sfilters">
      <div class="chips" id="dchips" role="group" aria-label="Date" style="padding:0"></div>
      <select id="scat" class="sel" aria-label="Show category"></select>
    </div>
    <ul class="shows" id="shows-list"></ul>
    <div class="partners" id="partners"></div>
    <div class="rates" id="show-rates"></div>
  </section>
  </div>
</div>

<!-- ============ WISHES ============ -->
<div class="view" data-view="wishes" id="v-wishes" hidden>
  <div class="wrap">
    <section class="sec" aria-labelledby="wp-h">
      <h2 id="wp-h" data-i="wpTitle"></h2>
      <p class="desc" data-i="wpDesc"></p>
      <p class="disc" data-i="wpDisc"></p>
      <div class="sfilters">
        <input id="wp-q" class="search" type="search" data-ip="wpSearch" aria-label="Search wishing posts" style="max-width:360px">
        <select id="wp-sort" class="sel" aria-label="Sort"></select>
      </div>
      <div class="chips" id="wp-cats" role="group" aria-label="Occasion" style="padding:10px 0 0"></div>
      <div class="wgrid" id="wp-grid"></div>
    </section>
  </div>
</div>

<!-- ============ ADVERTISE ============ -->
<div class="view" data-view="advertise" id="v-advertise" hidden>
  <div class="wrap">
    <section class="sec" aria-labelledby="adv-h">
      <h2 id="adv-h" data-i="advPageTitle"></h2>
      <p class="desc" data-i="advDesc"></p>
    <div class="rates" id="rates"></div>
    </section>
  <section class="sec enq enq-sec" id="enq" aria-labelledby="enq-h">
  <form id="enq-form" novalidate>
    <h2 id="enq-h"></h2>
    <p class="meta" id="enq-sub" style="margin:0"></p>
    <p class="meta" id="enq-contactline" style="margin:6px 0 0"></p>
    <div class="row2">
      <div class="fld"><label for="e-name" id="l-name"></label><input id="e-name" autocomplete="name"></div>
      <div class="fld"><label for="e-org" id="l-org"></label><input id="e-org" autocomplete="organization"></div>
    </div>
    <div class="fld"><label for="e-contact" id="l-contact"></label><input id="e-contact" autocomplete="off"></div>
    <div class="fld"><label for="e-pkg" id="l-pkg"></label><select id="e-pkg"></select></div>
    <div id="e-showfields">
      <div class="row2">
        <div class="fld"><label for="e-sname" id="l-sname"></label><input id="e-sname"></div>
        <div class="fld"><label for="e-sdate" id="l-sdate"></label><input id="e-sdate" type="date" min="2026-10-10" max="2026-11-30"></div>
      </div>
      <div class="row2">
        <div class="fld"><label for="e-venue" id="l-venue"></label><input id="e-venue"></div>
        <div class="fld"><label for="e-link" id="l-link"></label><input id="e-link" type="url" inputmode="url"></div>
      </div>
    </div>
    <div class="fld"><label for="e-msg" id="l-msg"></label><textarea id="e-msg"></textarea></div>
    <div class="err" id="e-err" role="alert"></div>
    <div class="acts2">
      <a class="btn map" id="e-gmail" target="_blank" rel="noopener" href="#"></a>
      <a class="btn" id="e-mail" href="#"></a>
      <a class="btn" id="e-wa" target="_blank" rel="noopener" href="#" hidden></a>
      <button type="button" class="btn" id="e-copy"></button>
    </div>
    <p class="fallback" id="e-fallback"></p>
  </form>
</section>
  </div>
</div>

<footer>
  <div class="wrap">
    <p id="copyright" style="color:var(--ink);font-weight:600"></p>
    <p id="legal-links"></p>
    <p data-i="footA"></p>
    <p data-i="footB"></p>
    <p data-i="footD"></p>
  </div>
</footer>


<dialog class="enq" id="legal" aria-labelledby="legal-h">
  <div style="position:relative;padding:20px">

    <p class="meta" id="legal-upd" style="margin:0"></p>
    <div id="legal-body"></div>
  </div>
</dialog>

<dialog class="enq" id="imgview" aria-labelledby="iv-h">
  <div style="padding:18px;position:relative">
    <button type="button" class="x" id="iv-x" aria-label="Close">×</button>

    <div class="acts2"><a class="btn map" id="iv-dl" href="#" download></a><button type="button" class="btn" id="iv-close"></button></div>
  </div>
</dialog>

<dialog class="enq" id="linkfb" aria-labelledby="lf-h">
  <div style="padding:20px">
    <h2 id="lf-h"></h2>
    <p class="meta" id="lf-p"></p>
    <input id="lf-url" class="search" readonly style="width:100%;margin-top:12px">
    <div class="acts2"><button type="button" class="btn map" id="lf-copy"></button><button type="button" class="btn" id="lf-close"></button></div>
    <p class="err" id="lf-msg" role="status"></p>
  </div>
</dialog>

<div class="fab" id="fab"></div>

<div class="trail" id="trail" role="region" aria-label="My pandal trail">
  <div class="in">
    <span id="trail-count"></span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" id="trail-plan" href="#/plan"></a>
      <a class="btn" id="trail-go" target="_blank" rel="noopener" href="#"></a>
      <button class="btn clear" id="trail-clear" type="button"></button>
    </div>
  </div>
</div>

/* ---------- language state ---------- */
let lang = "en";
try{ const s=localStorage.getItem("pujo26-lang"); if(s==="bn"||s==="en") lang=s; else if((navigator.language||"").toLowerCase().startsWith("bn")) lang="bn"; }catch(e){}
const T = (k)=>{const v=UI[lang][k]; return v===undefined?UI.en[k]:v;};
const pick = (en,bn)=> (lang==="bn" && bn) ? bn : en;
const nameL = p => lang==="bn" ? (BN_NAME[p.n] || p.n.replace(/^Salt Lake (\w+) Block$/,"সল্টলেক $1 ব্লক")) : p.n;
const areaL = p => lang==="bn" ? (BN_AREA[p.a]||p.a) : p.a;
const themeL = p => lang==="bn" ? (BN_THEME[p.t]||p.t) : p.t;
const metroL = p => lang==="bn" ? (BN_METRO[p.m]||p.m) : p.m;
const regionName = R => pick(R.en,R.bn);

const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapUrl = p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.n+" Durga Puja, "+p.a+", Kolkata");
const metroWalkUrl = p=>"https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(p.m+" Metro Station, Kolkata")+"&destination="+encodeURIComponent(p.n+" Durga Puja, "+p.a+", Kolkata");
const hoodUrl = h=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("Durga Puja pandal "+h+", Kolkata");
const venueUrl = s=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.venue+", "+(s.area||"")+", Kolkata");
const mailto = sub=>"mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent(sub||SPONSOR_SUBJECT);

/* ---------- state ---------- */
let region="all", query="", lineF="", showDate="all", showCat="all", legalKind="";

function hay(p){ return (p.n+" "+p.a+" "+p.t+" "+p.m+" "+nameL(p)+" "+areaL(p)+" "+themeL(p)+" "+metroL(p)).toLowerCase(); }
function matches(p){
  if(region!=="all" && p.r!==region) return false;
  if(lineF && p.l!==lineF) return false;
  if(query && !hay(p).includes(query)) return false;
  return true;
}

/* ---------- pandal list ---------- */
function itemHTML(p){
  const feat = FEATURED_PANDALS.includes(p.n);
  const inTrail = trail.includes(p.n);
  const bonedi = p.f.includes("bonedi") ? '<span class="tag">'+T("bonedi")+'</span>' : "";
  const sp = feat ? '<span class="tag sp">'+T("sponsored")+'</span>' : "";
  const theme = p.t ? '<div class="theme">'+esc(themeL(p))+'</div>' : '<div class="theme tbc">'+T("themeTbc")+'</div>';
  const metro = p.l==="N"
    ? '<div class="metro"><span class="mline"><i class="dot"></i>'+T("noMetroLine")+'</span><small>'+T("cabBus")+'</small></div>'
    : '<div class="metro"><span class="mline"><i class="dot '+p.l+'"></i>'+esc(metroL(p))+(p.ap?" ~":"")+'</span><small>'+T(p.l)+'</small></div>';
  const walk = p.l==="N" ? "" : '<a class="btn ghost" target="_blank" rel="noopener" href="'+metroWalkUrl(p)+'">'+T("walkMetro")+'</a>';
  return '<li class="item"><div><h3>'+esc(nameL(p))+mapBtn(p)+sp+bonedi+'</h3><div class="meta">'+esc(areaL(p))+'</div>'+theme+'</div>'+metro+
    '<div class="acts">'+walk+
    '<button type="button" class="btn add" data-name="'+esc(p.n)+'" aria-pressed="'+inTrail+'">'+(inTrail?T("inTrail"):T("addTrail"))+'</button></div></li>';
}
function inlineSponsorHTML(r){
  return INLINE_SPONSORS.filter(s=>s.region===r).map(s=>
    '<li class="inline-sp"><div><span class="tag sp" style="margin:0 0 4px">'+T("sponsored")+'</span><h3>'+esc(pick(s.name,s.name_bn))+'</h3><p>'+esc(pick(s.blurb,s.blurb_bn))+'</p></div>'+
    '<a class="btn" style="align-self:center" target="_blank" rel="sponsored noopener" href="'+esc(s.url)+'">'+esc(s.cta||"View")+'</a></li>').join("");
}
function renderRegions(){
  const out=[];
  REGIONS.forEach(R=>{
    if(region!=="all" && R.id!==region) return;
    let items=PANDALS.filter(p=>p.r===R.id && matches(p));
    items.sort((a,b)=>(FEATURED_PANDALS.includes(b.n)?1:0)-(FEATURED_PANDALS.includes(a.n)?1:0));
    const hoods='<div class="hoods">'+R.hoods.map(h=>'<a target="_blank" rel="noopener" href="'+hoodUrl(h[0])+'">'+T("allPujas")+esc(pick(h[0],h[1]))+'</a>').join("")+'</div>';
    let list="";
    if(items.length){
      const parts=items.map((p,i)=>itemHTML(p)+(i===2?inlineSponsorHTML(R.id):""));
      if(items.length<3) parts.push(inlineSponsorHTML(R.id));
      list='<ul class="list">'+parts.join("")+'</ul>';
    } else list='<div class="empty">'+T("emptyRegion")+'</div>';
    out.push('<section class="region" id="r-'+R.id+'" aria-labelledby="h-'+R.id+'"><h2 id="h-'+R.id+'">'+esc(regionName(R))+'</h2><p class="desc">'+esc(pick(R.desc,R.desc_bn))+'</p>'+hoods+list+'</section>');
  });
  document.getElementById("regions").innerHTML=out.join("");
}
function renderChips(){
  const base=PANDALS.filter(p=>(!lineF||p.l===lineF)&&(!query||hay(p).includes(query)));
  const mk=(id,label,n)=>'<button type="button" class="chip" data-r="'+id+'" aria-pressed="'+(region===id)+'">'+esc(label)+'<small>'+(lang==="bn"?toBn(n):n)+'</small></button>';
  document.getElementById("chips").innerHTML=mk("all",T("allRegions"),base.length)+REGIONS.map(R=>mk(R.id,regionName(R),base.filter(p=>p.r===R.id).length)).join("");
}

function renderTrail(){
  const el=document.getElementById("trail");
  document.getElementById("trail-go").textContent=T("trailGo");
  document.getElementById("trail-clear").textContent=T("trailClear");
  document.body.classList.toggle("has-trail",trail.length>0);
  if(!trail.length){ el.classList.remove("show"); return; }
  el.classList.add("show");
  document.getElementById("trail-count").textContent=T("trailN")(trail.length);
  document.getElementById("trail-plan").textContent=T("trailPlan");
  const ord=planOrder(trail,"auto");
  document.getElementById("trail-go").href = ord.length>1 ? legUrl(ord.slice(0,9)) : (ord[0]?mapUrl(ord[0]):"#");
}

      const contact=[s.phone,s.email,pick(s.location,s.location_bn)].filter(Boolean).map(esc).join(" · ");
      const links=(s.links&&s.links.length?s.links:(s.url?[{label:s.cta||"Visit",url:s.url}]:[])).filter(l=>/^https?:\/\//i.test(l.url||"")).map(l=>'<a class="btn map" target="_blank" rel="sponsored noopener" href="'+esc(l.url)+'">'+esc(pick(l.label,l.label_bn))+'</a>').join("");

    }
    return '<div class="slot open '+(plat?"plat":"")+'"><span class="tier">'+T(plat?"platOpen":"goldOpen")+'</span><h3>'+T("yourBrand")+'</h3><p>'+T(plat?"platPitch":"goldPitch")+'</p><button type="button" class="go linkbtn" data-enq="sponsor" data-label="'+(plat?"Platinum partner":"Gold partner")+'">'+T("reserve")+'</button></div>';

/* ---------- route planner ---------- */
const rad=x=>x*Math.PI/180;
function hav(a,b){const R=6371,dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]);const s=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
const pByName=n=>PANDALS.find(p=>p.n===n);
const dist=(a,b)=>hav(COORDS[a.n],COORDS[b.n])*1.35;   // straight line scaled for roads
function planOrder(names,first){
  const pts=names.map(pByName).filter(Boolean);
  const n=pts.length;
  if(n<3){ if(n===2&&first!=="auto"&&pts[1].n===first) pts.reverse(); else if(n===2&&first==="auto"&&COORDS[pts[1].n][0]>COORDS[pts[0].n][0]) pts.reverse(); return pts; }
  const D=pts.map(a=>pts.map(b=>dist(a,b)));
  const len=o=>{let s=0;for(let i=0;i<o.length-1;i++)s+=D[o[i]][o[i+1]];return s;};
  const nn=s=>{const o=[s],left=new Set(pts.map((_,i)=>i));left.delete(s);while(left.size){const l=o[o.length-1];let b=-1,bd=1e9;left.forEach(j=>{if(D[l][j]<bd){bd=D[l][j];b=j;}});o.push(b);left.delete(b);}return o;};
  const opt=(o,fixed)=>{let best=o,bl=len(o),imp=true;const st=fixed?1:0;while(imp){imp=false;for(let i=st;i<best.length-1;i++)for(let k=i+1;k<best.length;k++){const c=best.slice(0,i).concat(best.slice(i,k+1).reverse(),best.slice(k+1));const l=len(c);if(l<bl-1e-9){best=c;bl=l;imp=true;}}}return best;};
  const fixedIdx=first==="auto"?-1:pts.findIndex(p=>p.n===first);
  const starts=fixedIdx>=0?[fixedIdx]:pts.map((_,i)=>i);
  let bestO=null,bestL=1e9;
  starts.forEach(s=>{const o=opt(nn(s),fixedIdx>=0);const l=len(o);if(l<bestL-1e-9){bestL=l;bestO=o;}});
  if(fixedIdx<0){ const a=pts[bestO[0]],b=pts[bestO[bestO.length-1]]; if(COORDS[b.n][0]>COORDS[a.n][0]) bestO=bestO.slice().reverse(); } // north to south
  return bestO.map(i=>pts[i]);
}

function fmtTime(mins){
  const past=mins>=1440, m=mins%1440, h=Math.floor(m/60), mm=m%60, h12=((h+11)%12)+1, mmS=String(mm).padStart(2,"0");

function timeline(order){

  let t=hh*60+mi, total=0; const out=[];

    if(i>0){ const km=dist(order[i-1],p), walk=km<1.2, mins=Math.max(3,Math.round(km/(walk?4.5:14)*60)); t+=mins; total+=km; leg={km,mins,walk}; }

    out.push('<h4>'+esc(regionName(R))+'</h4>'+items.map(p=>'<label><input type="checkbox" data-name="'+esc(p.n)+'"'+(trail.includes(p.n)?" checked":"")+'><span>'+esc(nameL(p))+'<small>'+esc(areaL(p))+'</small></span></label>').join(""));
  });
  $("msel-list").innerHTML=out.join("")||'<p class="meta">—</p>';
}

function setMsel(open){ $("msel-panel").hidden=!open; $("msel-btn").setAttribute("aria-expanded",String(open)); if(open) setTimeout(()=>$("msel-q").focus({preventScroll:true}),30); }
function renderPlannerStatic(){
  $("l-msel").textContent=T("plSelectLbl"); $("msel-q").placeholder=T("plSearch"); $("msel-q").setAttribute("aria-label",T("plSearch"));
  $("msel-done").textContent=T("plDone"); $("msel-clear").textContent=T("plClear");
  $("l-day").textContent=T("plDay"); $("l-start").textContent=T("plStart"); $("l-dwell").textContent=T("plDwell"); $("l-first").textContent=T("plFirst");
  const dates=[17,18,19,20,21];
  $("pl-day").innerHTML=T("days").map((d,i)=>'<option value="'+i+'"'+(plan.day===i?" selected":"")+'>'+esc(d+" · "+nb(dates[i])+" "+T("mo")[9])+'</option>').join("");
  $("pl-dwell").innerHTML=[20,30,45,60,90].map(m=>'<option value="'+m+'"'+(plan.dwell===m?" selected":"")+'>'+esc(T("plMin")(m))+'</option>').join("");
}
function updatePlanner(){
  // selection button + chips
  $("msel-btn").textContent=T("plSelect")(trail.length);
  $("pl-chips").innerHTML=trail.map(n=>{const p=pByName(n);return '<span class="pchip">'+esc(nameL(p))+'<button type="button" data-rm="'+esc(n)+'" aria-label="'+esc(T("plRemove")+": "+nameL(p))+'">×</button></span>';}).join("");
  syncMsel();
  // start-with select
  const firstSel=$("pl-first");
  if(plan.first!=="auto" && !trail.includes(plan.first)) plan.first="auto";
  firstSel.innerHTML='<option value="auto">'+esc(T("plAuto"))+'</option>'+trail.map(n=>'<option value="'+esc(n)+'"'+(plan.first===n?" selected":"")+'>'+esc(nameL(pByName(n)))+'</option>').join("");
  firstSel.value=plan.first;
  $("pl-daynote").textContent=T("dayNotes")[plan.day]||"";
  const out=$("pl-out"), sum=$("pl-sum"), act=$("pl-actions");
  if(trail.length<2){
    out.innerHTML=""; act.innerHTML="";
    sum.innerHTML='<div class="pl-empty">'+esc(T(trail.length===1?"plOne":"plEmpty"))+'</div>';
    return;
  }
  const order=planOrder(trail,plan.first);
  const tl=timeline(order);
  sum.innerHTML='<div class="pl-sum">'+esc(T("plTotal")(order.length,nb(tl.km.toFixed(1)),tStr(tl.end)))+'</div>';
  out.innerHTML=tl.stops.map((s,i)=>{
    const p=s.p;
    const leg=s.leg?'<div class="leg">'+esc(s.leg.walk?T("plLegWalk")(s.leg.mins,s.leg.km.toFixed(1)):T("plLegRide")(s.leg.mins,s.leg.km.toFixed(1)))+'</div>':"";
    const metro=p.l==="N"?esc(T("noMetroLine")):'<i class="dot '+p.l+'" style="display:inline-block;vertical-align:middle;margin-right:5px"></i>'+esc(metroL(p))+(p.ap?" ~":"");
    return '<li>'+leg+'<div class="stop"><span class="num">'+nb(i+1)+'</span><div><h3>'+esc(nameL(p))+mapBtn(p)+'</h3><div class="meta">'+esc(areaL(p))+' · '+metro+'</div></div><div class="times">'+esc(tStr(s.arrive))+'<span>→ '+esc(tStr(s.leave))+'</span></div></div></li>';
  }).join("");
  // route buttons (Google Maps takes ~9 stops per link)
  const btns=[];
  for(let i=0;i<order.length-1;i+=8){ const leg=order.slice(i,i+9); btns.push('<a class="btn map" target="_blank" rel="noopener" href="'+legUrl(leg)+'">'+esc(T("plLegs")(i+1,i+leg.length))+'</a>'); }
  const dates=[17,18,19,20,21];
  const lines=tl.stops.map((s,i)=>(i+1)+". "+tStr(s.arrive)+"  "+nameL(s.p)+" ("+areaL(s.p)+")");
  const share=T("plShareHead")+" – "+T("days")[plan.day]+" "+nb(dates[plan.day])+" "+T("mo")[9]+"\n"+lines.join("\n")+"\n"+(location.href.startsWith("http")?location.href:"");
  btns.push('<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">'+esc(T("plWa"))+'</a>');
  act.innerHTML=btns.join("");
}
function toggleTrail(name,on){
  const i=trail.indexOf(name);
  if(on&&i===-1) trail.push(name); if(!on&&i>-1) trail.splice(i,1);
  saveTrail(); renderRegions(); renderTrail(); updatePlanner();
}

/* ---------- home page + view routing ---------- */
const VIEWS=["home","pandals","plan","shows","wishes","advertise"];
const LEGACY={planner:"plan",regions:"pandals",shows:"shows",sponsors:"home",enq:"advertise",home:"home"};
let currentView="";
function routeFromHash(){
  let r=(location.hash||"").replace(/^#\/?/,"");
  if(LEGACY[r]) r=LEGACY[r];
  return VIEWS.includes(r)?r:"home";
}
function showView(v){
  const changed=v!==currentView;
  currentView=v;
  document.querySelectorAll(".view").forEach(el=>{ el.hidden = el.dataset.view!==v; });
  document.querySelectorAll("#tabs a").forEach(a=>{ if(a.dataset.nav===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.body.dataset.view=v;
  if(changed) window.scrollTo(0,0);
}
function goto(v,cb){
  if(currentView!==v){ showView(v); try{ history.pushState(null,"","#/"+v); }catch(e){} }
  if(cb) setTimeout(cb,40);
}
window.addEventListener("hashchange",()=>showView(routeFromHash()));
window.addEventListener("popstate",()=>showView(routeFromHash()));

/* ---------- wishing posts page ---------- */
const WISH_CAT_IDS=["mahalaya","shashthi","saptami","ashtami","navami","bijoya","sharodiya","business"];
let wishCat="all", wishQ="", wishSort="feat";
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?String(u):"";
const safeAsset=u=>{u=String(u||""); return /^(https?:\/\/|data:image\/(jpeg|png|webp|gif);base64,|(?:\.\/)?[\w\-\/]+\.(jpe?g|png|webp|gif|pdf|mp4)$)/i.test(u)?u:"";};
function wishCard(w){
  const link=safeUrl(w.url), img=safeAsset(w.img), dl=safeAsset(w.download);
  const title=pick(w.title,w.title_bn);
  const visual=img?'<button type="button" class="wimg wimg-btn" data-iv="'+esc(w.id||title)+'" aria-label="'+esc(T("wpView")+": "+title)+'"><img src="'+esc(img)+'" alt="'+esc(w.alt||title)+'" loading="lazy"></button>':'<div class="wimg"><div class="poster"><span class="pg">'+esc(T("wpPoster")[w.cat]||T("wpPoster").sharodiya)+'</span><span class="pt">'+esc(title)+'</span></div></div>';
  const buy=link?'<a class="btn map" target="_blank" rel="noopener" href="'+esc(link)+'">'+T("wpBuy")+'</a>':"";
  const down=dl?'<a class="btn map" href="'+esc(dl)+'" download="'+esc(w.file||"wishing-post.jpg")+'">'+T("wpDownload")+'</a>':"";
  const price=w.free?T("wpFree"):(w.price||"");
  return '<article class="wcard'+(w.featured?" promo":"")+'">'+visual+'<div class="wbody"><div><span class="tag" style="margin:0">'+esc(T("wpCats")[w.cat]||w.cat)+'</span>'+(w.featured?'<span class="tag sp">'+T("wpFeatured")+'</span>':"")+'</div><h3>'+esc(title)+'</h3>'+(w.format?'<div class="meta">'+esc(w.format)+'</div>':"")+(w.use?'<div class="meta">'+esc(pick(w.use,w.use_bn))+'</div>':"")+'<div class="wbuy" style="flex-wrap:wrap"><span class="price">'+esc(price)+'</span><span style="display:flex;gap:8px;flex-wrap:wrap">'+down+buy+'</span></div></div></article>';
}
function renderWishes(){
  $("wp-cats").innerHTML=[["all",T("wpAll")]].concat(WISH_CAT_IDS.map(c=>[c,T("wpCats")[c]])).map(c=>'<button type="button" class="chip" data-wc="'+c[0]+'" aria-pressed="'+(wishCat===c[0])+'">'+esc(c[1])+'</button>').join("");
  $("wp-sort").innerHTML=[["feat",T("wpSortFeat")],["low",T("wpSortLow")],["high",T("wpSortHigh")],["new",T("wpSortNew")]].map(o=>'<option value="'+o[0]+'"'+(wishSort===o[0]?" selected":"")+'>'+esc(o[1])+'</option>').join("");
  let list=WISH_POSTS.filter(w=>wishCat==="all"||w.cat===wishCat);
  const qq=wishQ.trim().toLowerCase();
  if(qq) list=list.filter(w=>((w.title||"")+" "+(w.title_bn||"")+" "+(w.format||"")).toLowerCase().includes(qq));
  const num=w=>typeof w.priceNum==="number"?w.priceNum:1e12;
  list=list.slice().sort((a,b)=> wishSort==="low"?num(a)-num(b) : wishSort==="high"?(num(b)===1e12?-1:0)||num(b)-num(a) : wishSort==="new"?String(b.added||"").localeCompare(String(a.added||"")) : (b.featured?1:0)-(a.featured?1:0)||String(b.added||"").localeCompare(String(a.added||"")));
  $("wp-grid").innerHTML = list.length ? list.map(wishCard).join("") : '<p class="empty" style="grid-column:1/-1">'+T(WISH_POSTS.length?"wpNone":"wpSoon")+'</p>';
}

/* ---------- links that must work inside restricted viewers ---------- */
// In-page navigation without relying on the browser following "#/page" links

  const a=e.target.closest('a[href^="#/"]'); if(!a||e.defaultPrevented) return;
  e.preventDefault();

  goto(VIEWS.includes(v)?v:"home");
});
// External links: open in a new tab, or show a copyable link if the viewer blocks it
function showLinkFallback(url){
  $("lf-h").textContent=T("lfTitle"); $("lf-p").textContent=T("lfText");
  $("lf-copy").textContent=T("lfCopy"); $("lf-close").textContent=T("lfClose");
  $("lf-url").value=url; $("lf-msg").textContent=""; $("lf-msg").style.color="";
  const d=$("linkfb"); if(typeof d.showModal==="function") d.showModal(); else d.setAttribute("open","");
  setTimeout(()=>{ $("lf-url").select(); },30);
}
document.addEventListener("click",e=>{
  const a=e.target.closest('a[target="_blank"]'); if(!a||e.defaultPrevented) return;
  const href=a.href; const raw=a.getAttribute("href")||"";
  if(!raw||raw==="#"||raw.startsWith("#")) { e.preventDefault(); return; }
  e.preventDefault();
  let w=null;
  try{ w=window.open(href,"_blank"); }catch(err){}
  if(w){ try{ w.opener=null; }catch(err){} } else showLinkFallback(href);
});
$("lf-close").addEventListener("click",()=>$("linkfb").close());
$("lf-copy").addEventListener("click",()=>{
  const url=$("lf-url").value;
  const ok=()=>{ $("lf-msg").style.color="var(--green)"; $("lf-msg").textContent=T("lfCopied"); };
  const fb=()=>{ $("lf-url").select(); let r=false; try{ r=document.execCommand("copy"); }catch(err){} if(r) ok(); else $("lf-msg").textContent=T("lfCopied"); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok,fb); else fb();
});
